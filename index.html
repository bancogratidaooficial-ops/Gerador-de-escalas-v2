<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESCALA 5x1 - FINAL</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:8px;margin:0;padding-top:90px}
.barra-chave{position:fixed;top:0;left:0;right:0;background:#1F4E79;color:#fff;padding:10px 12px;z-index:9999;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.botoes-topo{display:flex;gap:5px;flex-wrap:wrap}
.botoes-topo button{padding:6px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px}
.btn-backup{background:#00ccff;color:#000}.btn-restaurar{background:#00ff88;color:#000}.btn-share{background:#ffcc00;color:#000}
.box{background:#fff;border-radius:12px;padding:12px;max-width:1100px;margin:auto}
label{font-size:11px;font-weight:bold;color:#1F4E79;display:block;margin-top:6px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-top:3px}
button{width:100%;padding:13px;border:0;border-radius:8px;color:#fff;font-weight:bold;margin:5px 0;cursor:pointer}
.v{background:#27ae60}.a{background:#1F4E79}.g{background:gray}.r{background:#c0392b}.o{background:#e67e22}.y{background:#f1c40f;color:#000}.p{background:#8e44ad}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}
th{background:#1F4E79;color:#fff;padding:6px}
td{border:1px solid #ccc;padding:5px;text-align:center}
.T{background:#C6EFCE}.F{background:#FFC7CE;font-weight:bold}.FM{background:#d6eaf8;font-weight:bold;border:2px solid #2980b9}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid #1F4E79;border-radius:10px;padding:10px;background:#f8faff;margin:8px 0}
.ok{background:#d4edda;padding:8px;border-radius:6px;color:#155724;font-size:12px;margin:6px 0;display:none}
.item-lista{background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}
.btn-excluir{background:#ff4444;color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer}
</style></head><body>

<div class="barra-chave">
  <div>🔑 <b>Chave: ESCALA-5X1-PR-2026</b> <small id="statusChave"></small></div>
  <div class="botoes-topo">
    <button class="btn-backup" onclick="fazerBackup()">💾 Backup</button>
    <button class="btn-restaurar" onclick="document.getElementById('inputRest').click()">♻️ Restaurar</button>
    <button class="btn-share" onclick="compartilhar()">🔗 Compartilhar</button>
    <button class="btn-share" style="background:#fff" onclick="convidar()">👥 Convidar</button>
  </div>
</div>
<input type="file" id="inputRest" accept=".json" style="display:none" onchange="processarRestaurar(event)">

<div class="box">
<h2 style="text-align:center">ESCALA 5x1 - VERSAO FINAL COM SALVAMENTO</h2>
<div id="msg" class="ok"></div>
<div class="card" style="background:#fff3cd;border-color:#e67e22">
<label style="color:#e67e22">DEFINIR INICIO DA ESCALA 5x1 (pra folga nao mudar)</label>
<div class="row"><div><label>Data que comecou a contar</label><input type="date" id="dataInicio" value="2026-10-01"></div><div><label>Quem folga nessa data?</label><select id="folgaInicial"><option value="0">Natal folga</option><option value="1">Kaue folga</option><option value="2">Mario folga</option><option value="3">Jose Marcos</option><option value="4">Folguista</option><option value="5">Todos trabalham</option></select></div></div>
<button class="y" onclick="definirEscala()">📌 DEFINIR E TRAVAR ESCALA 5x1</button>
</div>
<div class="card">
<label>1 - NOME</label><input id="nome" placeholder="Ex: Jose Marcos">
<label>2 - HORARIO</label><div class="row"><input type="time" id="hin" value="10:00"><input type="time" id="hout" value="18:20"></div>
<label>3 - TIPO</label><select id="tipo" onchange="trocaTipo()"><option value="5x1">5x1 AUTOMATICO</option><option value="fixa">FOLGA FIXA</option><option value="encarregado">ENCARREGADO Sab Dom</option><option value="folguista">FOLGUISTA MADRUGADA</option><option value="personal">PERSONALIZADA</option></select>
<div id="areaFixa" style="display:none"><label>DIA FOLGA</label><select id="diaSemana"><option>Segunda</option><option>Terca</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sabado</option><option>Domingo</option></select></div>
<div id="area5x1"><label>INICIO FOLGA</label><select id="inicioFolga"><option value="0">Folga 06,12,18,24,30</option><option value="1">Folga 05,11,17,23,29</option><option value="2">Folga 04,10,16,22,28</option><option value="3">Folga 03,09,15,21,27</option><option value="4">Folga 02,08,14,20,26</option><option value="5">Folga 01,07,13,19,25,31</option></select></div>
<div id="areaPers" style="display:none"><label>DIAS QUE FOLGA</label><input id="diasFolga" placeholder="Ex: 5,12,19,26"></div>
<div id="areaFolguista" style="display:none;background:#d6eaf8;padding:8px;border-radius:6px;margin-top:6px;font-size:11px"><b>Folguista so quando madrugada folgar.</b></div>
<button class="v" onclick="add()">+ ADICIONAR</button>
</div>
<div class="row"><div><label>MES</label><select id="mes"><option value="9">SETEMBRO</option><option value="10" selected>OUTUBRO</option><option value="11">NOVEMBRO</option></select></div><div><label>ANO</label><select id="ano"><option>2026</option></select></div></div>
<button class="a" onclick="gerar()">GERAR ESCALA AGORA</button>
<div class="row"><button class="p" onclick="salvarDefinitivo()">💾 SALVAR DEFINITIVA</button><button class="y" onclick="carregarSalvo()">📂 CARREGAR SALVA</button></div>
<div id="lista" style="background:#eee;padding:8px;border-radius:8px;margin:6px 0;font-size:12px"></div>
<div style="overflow:auto"><table id="tab"></table></div>
<div class="row"><button class="o" onclick="exemplo()">CARREGAR EXEMPLO COMPLETO</button><button class="a" onclick="window.print()">IMPRIMIR PDF</button></div>
<button class="r" onclick="limparTudo()">LIMPAR TUDO</button>
</div>
<script>
var funcs=[];var escalaTravada=null;
const KEY_FUNCS='funcsEscala_v2'; const KEY_TRAVA='escalaTravada_v2'; const KEY_BKP='funcsEscala_bkp_v2';

function trocaTipo(){var t=document.getElementById('tipo').value;document.getElementById('areaFixa').style.display=t=='fixa'?'block':'none';document.getElementById('areaPers').style.display=t=='personal'?'block':'none';document.getElementById('area5x1').style.display=t=='5x1'?'block':'none';document.getElementById('areaFolguista').style.display=t=='folguista'?'block':'none';if(t=='folguista'){document.getElementById('nome').value='FOLGUISTA DA MADRUGADA';document.getElementById('hin').value='22:40';document.getElementById('hout').value='07:00';}}
function showMsg(txt){var m=document.getElementById('msg');m.style.display='block';m.innerHTML=txt;setTimeout(()=>{m.style.display='none'},4000);}

function definirEscala(){
  var data=document.getElementById('dataInicio').value;
  var quem=document.getElementById('folgaInicial').value;
  escalaTravada={data:data,quem:parseInt(quem),definida:true};
  localStorage.setItem(KEY_TRAVA,JSON.stringify(escalaTravada));
  localStorage.setItem('escalaTravada',JSON.stringify(escalaTravada)); // compatibilidade antiga
  document.getElementById('statusChave').innerText='✅ Travada em '+data;
  showMsg('✅ ESCALA TRAVADA! Inicio: '+data);salvarDefinitivo();gerar();
}

function salvarDefinitivo(){
  localStorage.setItem(KEY_FUNCS,JSON.stringify(funcs));
  localStorage.setItem(KEY_BKP,JSON.stringify(funcs));
  localStorage.setItem('funcsEscala',JSON.stringify(funcs));
  if(escalaTravada)localStorage.setItem(KEY_TRAVA,JSON.stringify(escalaTravada));
  localStorage.setItem('mes',document.getElementById('mes').value);
  showMsg('✅ SALVO! Pode fechar o app que volta igual.');
}

function carregarSalvo(){
  var s=localStorage.getItem(KEY_FUNCS) || localStorage.getItem('funcsEscala') || localStorage.getItem(KEY_BKP);
  var t=localStorage.getItem(KEY_TRAVA) || localStorage.getItem('escalaTravada');
  if(!s){showMsg('❌ Nenhuma salva');return}
  funcs=JSON.parse(s);if(t)escalaTravada=JSON.parse(t);
  if(escalaTravada) document.getElementById('dataInicio').value=escalaTravada.data;
  lista();gerar();showMsg('📂 CARREGADA! '+funcs.length+' funcionarios');
}

function add(){
  var nome=document.getElementById('nome').value.trim();if(!nome){alert('Digite nome');return}
  var hin=document.getElementById('hin').value;var hout=document.getElementById('hout').value;var hor=hin+'-'+hout;
  var tipo=document.getElementById('tipo').value;var diaSemana=document.getElementById('diaSemana').value;
  var inicio=parseInt(document.getElementById('inicioFolga').value); if(isNaN(inicio)) inicio=0;
  var diasFolga=document.getElementById('diasFolga').value;
  funcs.push({nome:nome,hor:hor,tipo:tipo,diaSemana:diaSemana,inicio:inicio,diasFolga:diasFolga});
  document.getElementById('nome').value='';lista();gerar();salvarDefinitivo();
}

function lista(){
  var d=document.getElementById('lista');
  if(funcs.length==0){d.innerHTML='Nenhum';return}
  var t='Adicionados: '+funcs.length+'<br>';
  for(var i=0;i<funcs.length;i++){
    var f=funcs[i];
    t+=`<div class="item-lista"><span>${i+1}. <b>${f.nome}</b> | ${f.hor} | ${f.tipo}</span> <button class="btn-excluir" onclick="rem(${i})">🗑️</button></div>`;
  }
  if(escalaTravada&&escalaTravada.definida) t+=`<br><b style=color:green>📌 Travada em: ${escalaTravada.data}</b>`;
  d.innerHTML=t;
  if(escalaTravada) document.getElementById('statusChave').innerText='✅ Travada em '+escalaTravada.data;
}

function rem(i){if(confirm('Remover 🗑️ '+funcs[i].nome+'?')){funcs.splice(i,1);lista();gerar();salvarDefinitivo();}}

function limparTudo(){
  if(confirm('Apagar tudo?')){
    funcs=[];escalaTravada=null;
    localStorage.removeItem(KEY_FUNCS);localStorage.removeItem(KEY_TRAVA);localStorage.removeItem(KEY_BKP);
    localStorage.removeItem('funcsEscala');localStorage.removeItem('escalaTravada');
    lista();gerar();document.getElementById('statusChave').innerText='';
  }
}

function exemplo(){
  funcs=[
    {nome:'Natal',hor:'15:20-22:40',tipo:'5x1',inicio:0,diaSemana:'Segunda',diasFolga:''},
    {nome:'Kaue',hor:'07:00-15:20',tipo:'5x1',inicio:1,diaSemana:'Segunda',diasFolga:''},
    {nome:'Mario (MADRUGADA FIXO)',hor:'22:40-07:00',tipo:'5x1',inicio:2,diaSemana:'Segunda',diasFolga:''},
    {nome:'Jose Marcos',hor:'10:00-18:20',tipo:'5x1',inicio:3,diaSemana:'Segunda',diasFolga:''},
    {nome:'FOLGUISTA DA MADRUGADA',hor:'22:40-07:00',tipo:'folguista',inicio:2,diaSemana:'Segunda',diasFolga:''},
    {nome:'Celio Encarregado',hor:'11:00-19:40',tipo:'encarregado',inicio:0,diaSemana:'Segunda',diasFolga:''}
  ];
  var trav=localStorage.getItem(KEY_TRAVA)||localStorage.getItem('escalaTravada');
  if(!trav){escalaTravada={data:document.getElementById('dataInicio').value,quem:0,definida:true};localStorage.setItem(KEY_TRAVA,JSON.stringify(escalaTravada));}
  lista();gerar();salvarDefinitivo();showMsg('✅ Exemplo carregado e travado!');
}

function gerar(){
  var mes=parseInt(document.getElementById('mes').value);var ano=parseInt(document.getElementById('ano').value);
  var dias=new Date(ano,mes,0).getDate();var tab=document.getElementById('tab');
  if(funcs.length==0){tab.innerHTML='<tr><td>Adicione funcionarios</td></tr>';return}
  var dsem=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  var h='<tr><th>Nome</th><th>Horario</th><th>Tipo</th>';for(var d=1;d<=dias;d++){var dt=new Date(ano,mes-1,d);h+='<th>'+d+'/'+mes+'<br>'+dsem[dt.getDay()]+'</th>';}h+='</tr>';
  var madrugadaFixo=null;
  for(var i=0;i<funcs.length;i++){if(funcs[i].nome.toLowerCase().includes('mario')){madrugadaFixo=funcs[i];break;}}
  if(!madrugadaFixo){for(var i=0;i<funcs.length;i++){if(funcs[i].hor.includes('22:40')&&funcs[i].tipo=='5x1'){madrugadaFixo=funcs[i];break;}}}
  for(var i=0;i<funcs.length;i++){
    var f=funcs[i];var ini = (typeof f.inicio==='number'?f.inicio:0);
    h+='<tr><td style=text-align:left><b>'+f.nome+'</b></td><td><small>'+f.hor+'</small></td><td><small>'+f.tipo+'</small></td>';
    for(var d=1;d<=dias;d++){
      var dt=new Date(ano,mes-1,d);var wd=dt.getDay();
      if(f.tipo=='encarregado'){if(wd==0||wd==6)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}
      else if(f.tipo=='fixa'){var mapa=['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];if(mapa[wd]==f.diaSemana)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}
      else if(f.tipo=='personal'){var ld=f.diasFolga.split(',').map(s=>parseInt(s.trim()));if(ld.includes(d))h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}
      else if(f.tipo=='folguista'){if(madrugadaFixo){var folgaM=(d+madrugadaFixo.inicio)%6==0;if(folgaM)h+="<td class='FM'>T<br><span style=font-size:8px>COBRE</span></td>";else h+="<td style=background:#eee>-</td>";}else{if((d+ini)%6==0)h+="<td class='FM'>T</td>";else h+="<td style=background:#eee>-</td>";}}
      else{if((d+ini)%6==0)h+="<td class='F'>F</td>";else h+="<td class='T'>T</td>";}
    }h+='</tr>';
  }tab.innerHTML=h;
}

// BACKUP / RESTAURAR / COMPARTILHAR
function fazerBackup(){
  var dados={data:new Date().toLocaleString('pt-BR'),versao:'FINAL_v2',escalaTravada:escalaTravada,funcionarios:funcs};
  var blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='backup_escala_5x1_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
  showMsg('💾 Backup baixado!');
}
function processarRestaurar(e){
  var arq=e.target.files[0];if(!arq)return;if(!confirm('Restaurar backup? Vai substituir atual.'))return;
  var r=new FileReader();r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      funcs=d.funcionarios||d.funcs||d||[];escalaTravada=d.escalaTravada||null;
      if(escalaTravada){localStorage.setItem(KEY_TRAVA,JSON.stringify(escalaTravada));document.getElementById('dataInicio').value=escalaTravada.data;}
      salvarDefinitivo();lista();gerar();showMsg('♻️ Restaurado com sucesso!');
    }catch(err){alert('Arquivo invalido');}
  };r.readAsText(arq);e.target.value='';
}
function compartilhar(){
  var txt=`📅 Escala 5x1 - ${funcs.length} pessoas\nBase: ${escalaTravada?escalaTravada.data:'não definida'}\n\n`+funcs.map(f=>`👤 ${f.nome}: ${f.hor} (${f.tipo})`).join('\n');
  if(navigator.share)navigator.share({title:'Escala 5x1',text:txt}); else {navigator.clipboard.writeText(txt);alert('✅ Copiado!');}
}
function convidar(){var url=location.href;navigator.clipboard.writeText(url).then(()=>alert('👥 Link copiado! Envie para convidar:\n'+url));}

window.onload=function(){
  var s=localStorage.getItem(KEY_FUNCS)||localStorage.getItem('funcsEscala')||localStorage.getItem(KEY_BKP);
  var t=localStorage.getItem(KEY_TRAVA)||localStorage.getItem('escalaTravada');
  if(s){try{funcs=JSON.parse(s);}catch(e){funcs=[]}}
  if(t){try{escalaTravada=JSON.parse(t);document.getElementById('dataInicio').value=escalaTravada.data;document.getElementById('statusChave').innerText='✅ Travada em '+escalaTravada.data;}catch(e){}}
  lista();if(funcs.length>0)gerar();trocaTipo();
  if(funcs.length>0) showMsg('📂 Recuperado automatico! '+funcs.length+' funcs');
}
</script></body></html>
