<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Escalas 5x1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F4E79">
<style>
*{box-sizing:border-box;}
body{
  font-family:Arial, sans-serif;
  background:#f0f2f5;
  padding:8px;
  margin:0;
  padding-top: 100px;
}
.barra-chave{
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:#1F4E79;
  color:#fff;
  padding:12px 15px;
  z-index:999;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.texto-chave{font-weight:bold;font-size:15px;}
.botoes-topo{display:flex;gap:6px;flex-wrap:wrap;}
.botoes-topo button{padding:6px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;}
.btn-backup{background:#00ccff; color:#000;}
.btn-restaurar{background:#00ff88; color:#000;}
.btn-compartilhar{background:#ffcc00; color:#000;}
.box{background:#fff;border-radius:12px;padding:12px;max-width:1000px;margin:0 auto 10px;}
h2{text-align:center; color:#1F4E79; margin:0 0 10px; font-size:18px;}
.msg{background:#e6ffea;color:#006622;padding:10px;border-radius:8px;margin:8px 0;display:none;}
.card{background:#f9f9f9;border-radius:10px;border:2px solid #e67e22;padding:12px;margin-bottom:10px;}
.row{display:grid;grid-template-columns:1fr 2fr;gap:6px;padding:4px 0;align-items:center;}
label{font-weight:bold; color:#1F4E79; font-size:14px;}
input, select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:15px;}
button{padding:10px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px 2px;}
button.a{background:#27ae60; color:#fff;}
button.b{background:#1F4E79; color:#fff;}
button.c{background:#e67e22; color:#fff;}
button.r{background:#c0392b; color:#fff;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
th, td{border:1px solid #ccc;padding:6px;text-align:center;}
th{background:linear-gradient(#d6eaf8, #bad9f5);}
tr:nth-child(even){background:#f8faff;}
.areaFixa{display:none; margin-top:10px;}
.lista-item{background:#f8faff;border:1px solid #1F4E79;border-radius:8px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.btn-excluir{background:#ff4444;color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;}
</style>
</head>
<body>

<div class="barra-chave">
  <div class="texto-chave">🔑 Chave: ESCALA-5X1-PR-2026</div>
  <div class="botoes-topo">
    <button class="btn-backup" onclick="fazerBackup()">💾 Backup</button>
    <button class="btn-restaurar" onclick="restaurarArquivo()">♻️ Restaurar</button>
    <button class="btn-compartilhar" onclick="compartilhar()">🔗 Compartilhar</button>
    <button class="btn-compartilhar" style="background:#fff" onclick="convidar()">👥 Convidar</button>
  </div>
</div>

<div class="box">
  <h2>📅 GERADOR DE ESCALAS 5x1 — VERSÃO CORRIGIDA</h2>
  <div id="msg" class="msg"></div>

  <div class="card">
    <label>DEFINIR INÍCIO DA ESCALA 5x1 (pra não mudar)</label>
    <div class="row">
      <label>Data que começou a contar:</label>
      <input type="date" id="dataInicio" value="2026-10-01">
    </div>
    <button class="a" onclick="definirEscala()">✅ DEFINIR E TRAVAR ESCALA 5x1</button>
  </div>

  <div id="areaFixa" class="areaFixa">
    <div class="card">
      <label>1 — NOME:</label>
      <input id="nome" placeholder="Ex: José Marcos">
      <div class="row">
        <label>2 — HORÁRIO:</label>
        <input type="time" id="hinicio" value="10:00">
        <input type="time" id="hterm" value="19:00">
      </div>
      <div class="row">
        <label>3 — TIPO:</label>
        <select id="tipo">
          <option value="5x1" selected>5x1 — AUTOMÁTICO COM RODÍZIO</option>
          <option value="folga">Folga fixa por dia da semana</option>
        </select>
      </div>
      <div class="row">
        <label>DIA FOLGA FIXA:</label>
        <select id="diaSemana">
          <option value="">Automático (5x1)</option>
          <option value="Segunda">Segunda</option>
          <option value="Terça">Terça</option>
          <option value="Quarta">Quarta</option>
          <option value="Quinta">Quinta</option>
          <option value="Sexta">Sexta</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
      </div>
      <div class="row">
        <label>DIAS QUE FOLGA (manual):</label>
        <input type="text" id="diasFolga" placeholder="Ex: 5,12,19,26 (deixa vazio pro auto)">
      </div>
      <button class="a" onclick="adicionar()">➕ ADICIONAR</button>
    </div>

    <div class="card">
      <div class="row">
        <label>MÊS:</label>
        <select id="mes">
          <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option><option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option><option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option><option value="10" selected>Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
        </select>
        <label>ANO:</label>
        <input type="number" id="ano" value="2026">
      </div>
      <button class="b" onclick="gerar()">📋 GERAR ESCALA AGORA</button>
      <button class="c" onclick="salvarDefinitivo()">💾 SALVAR DEFINITIVA</button>
    </div>

    <div id="lista" class="box" style="background:#eee; padding:8px; border-radius:8px;">
      <strong>Pessoas cadastradas:</strong> Nenhuma
    </div>

    <div class="box" style="overflow:auto;">
      <table id="tabela"></table>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;">
      <button class="b" onclick="exemplo()">📝 CARREGAR EXEMPLO</button>
      <button class="r" onclick="limparTudo()">🗑️ LIMPAR TUDO</button>
    </div>
  </div>
</div>

<input type="file" id="inputRestaurar" accept=".json" style="display:none" onchange="processarRestaurar(event)">

<script>
const CHAVE_DADOS = 'escala_5x1_dados_v2';
const CHAVE_TRAVADA = 'escala_travada_v2';
let funcs = [];
let escalaTravada = null;

window.onload = function(){
  const dadosSalvos = localStorage.getItem(CHAVE_DADOS);
  const travadaSalva = localStorage.getItem(CHAVE_TRAVADA);
  if(dadosSalvos) funcs = JSON.parse(dadosSalvos);
  if(travadaSalva){
    escalaTravada = travadaSalva;
    document.getElementById('dataInicio').value = escalaTravada;
    document.getElementById('areaFixa').style.display = 'block';
    listar();
  }
};

function definirEscala(){
  const data = document.getElementById('dataInicio').value;
  if(!data){ alert('Escolha uma data!'); return; }
  escalaTravada = data;
  localStorage.setItem(CHAVE_TRAVADA, data);
  document.getElementById('areaFixa').style.display = 'block';
  mostrarMsg('✅ Escala travada em: ' + data + ' - não vai mais sumir!');
}

function mostrarMsg(texto){
  const m = document.getElementById('msg');
  m.style.display = 'block';
  m.textContent = texto;
  setTimeout(()=>m.style.display='none', 4000);
}

function adicionar(){
  const nome = document.getElementById('nome').value.trim();
  if(!nome){ alert('Digite o nome!'); return; }
  funcs.push({
    nome,
    hinicio: document.getElementById('hinicio').value,
    hterm: document.getElementById('hterm').value,
    tipo: document.getElementById('tipo').value,
    diaSemana: document.getElementById('diaSemana').value,
    diasFolga: document.getElementById('diasFolga').value
  });
  salvarDefinitivo();
  listar();
  document.getElementById('nome').value = '';
  document.getElementById('diasFolga').value = '';
  mostrarMsg('✅ ' + nome + ' adicionado!');
}

function listar(){
  const lista = document.getElementById('lista');
  if(funcs.length === 0){
    lista.innerHTML = '<strong>Pessoas cadastradas:</strong> Nenhuma';
    return;
  }
  lista.innerHTML = '<strong>Pessoas cadastradas:</strong>' + funcs.map((p, i) => `
    <div class="lista-item">
      <div><strong>${p.nome}</strong><br><small>${p.hinicio} às ${p.hterm} — ${p.tipo} ${p.diasFolga?'(folgas: '+p.diasFolga+')':''}</small></div>
      <button class="btn-excluir" onclick="remover(${i})">🗑️</button>
    </div>
  `).join('');
}

function remover(indice){
  if(confirm('Remover essa pessoa? 🗑️')){
    funcs.splice(indice, 1);
    salvarDefinitivo();
    listar();
  }
}

function salvarDefinitivo(){
  localStorage.setItem(CHAVE_DADOS, JSON.stringify(funcs));
  // backup duplo pra chave não sumir
  localStorage.setItem(CHAVE_DADOS+'_bkp', JSON.stringify(funcs));
}

function limparTudo(){
  if(!confirm('Tem certeza? Apaga tudo!')) return;
  funcs = [];
  escalaTravada = null;
  localStorage.removeItem(CHAVE_DADOS);
  localStorage.removeItem(CHAVE_TRAVADA);
  document.getElementById('areaFixa').style.display = 'none';
  document.getElementById('tabela').innerHTML = '';
  listar();
}

function exemplo(){
  funcs = [
    {nome:'Natália', hinicio:'08:00', hterm:'17:00', tipo:'5x1', diaSemana:'', diasFolga:''},
    {nome:'Segundo', hinicio:'09:00', hterm:'18:00', tipo:'5x1', diaSemana:'', diasFolga:''},
    {nome:'José', hinicio:'10:00', hterm:'19:00', tipo:'5x1', diaSemana:'', diasFolga:''}
  ];
  salvarDefinitivo();
  listar();
  mostrarMsg('✅ Exemplo carregado!');
}

// === CORREÇÃO PRINCIPAL AQUI ===
function gerar(){
  if(!escalaTravada){ alert('Defina a data de início primeiro!'); return; }
  const mes = parseInt(document.getElementById('mes').value);
  const ano = parseInt(document.getElementById('ano').value);
  const tabela = document.getElementById('tabela');
  const diasMes = new Date(ano, mes, 0).getDate();
  const nomesDias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const baseDate = new Date(escalaTravada + 'T12:00:00');

  let cabecalho = '<tr><th>Data</th><th>Dia</th>';
  funcs.forEach(p => cabecalho += `<th>${p.nome}</th>`);
  cabecalho += '</tr>';
  
  let linhas = '';
  for(let dia=1; dia<=diasMes; dia++){
    const dataAtual = new Date(ano, mes-1, dia, 12,0,0);
    const diaSemanaIdx = dataAtual.getDay();
    const diaSemanaNome = nomesDias[diaSemanaIdx];
    const dataStr = `${String(dia).padStart(2,'0')}/${String(mes).padStart(2,'0')}`;
    
    let celulas = '';
    funcs.forEach((p, idx) => {
      let texto = `${p.hinicio}–${p.hterm}`;
      let estilo = '';
      let isFolga = false;

      if(p.diasFolga && p.diasFolga.trim() !== ''){
        let lista = p.diasFolga.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n));
        if(lista.includes(dia)) isFolga = true;
      } else if(p.tipo === '5x1'){
        const diffDias = Math.floor((dataAtual - baseDate) / (1000*60*60*24));
        const ciclo = ((diffDias + idx) % 6 + 6) % 6; // CORRIGIDO: +idx pra rodízio e +6 pra não negativar
        if(ciclo === 5) isFolga = true;
      } else if(p.tipo === 'folga' && p.diaSemana){
        if(diaSemanaNome.toLowerCase().includes(p.diaSemana.substring(0,3).toLowerCase())) isFolga = true;
      }

      if(isFolga){ texto = 'FOLGA'; estilo = 'background:#ffdddd; color:#c0392b; font-weight:bold;'; }
      celulas += `<td style="${estilo}">${texto}</td>`;
    });
    
    linhas += `<tr><td>${dataStr}</td><td>${diaSemanaNome}</td>${celulas}</tr>`;
  }
  
  tabela.innerHTML = cabecalho + linhas;
  mostrarMsg('✅ Escala gerada corretamente!');
}

function fazerBackup(){
  const dados = { data: new Date().toLocaleString('pt-BR'), escalaTravada, funcionarios: funcs };
  const blob = new Blob([JSON.stringify(dados, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `backup_escala_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
}
function restaurarArquivo(){ document.getElementById('inputRestaurar').click(); }
function processarRestaurar(event){
  const arq = event.target.files[0]; if(!arq) return;
  if(!confirm('Restaurar? Vai substituir os dados atuais.')) return;
  const leitor = new FileReader();
  leitor.onload = (e) => {
    try{
      const d = JSON.parse(e.target.result);
      funcs = d.funcionarios || d || [];
      if(d.escalaTravada){ escalaTravada = d.escalaTravada; localStorage.setItem(CHAVE_TRAVADA, escalaTravada); document.getElementById('dataInicio').value = escalaTravada; document.getElementById('areaFixa').style.display = 'block'; }
      salvarDefinitivo(); listar(); mostrarMsg('✅ Restaurado!');
    }catch{ alert('❌ Arquivo inválido!'); }
  };
  leitor.readAsText(arq);
  event.target.value = '';
}
function compartilhar(){
  const texto = `📅 Escala 5x1 — ${funcs.length} pessoas\nBase: ${escalaTravada}\n\n` + funcs.map(p => `👤 ${p.nome}: ${p.hinicio} às ${p.hterm}`).join('\n');
  if(navigator.share) navigator.share({title:'Escala 5x1', text:texto});
  else { navigator.clipboard.writeText(texto); alert('✅ Copiado!'); }
}
function convidar(){
  const url = location.href;
  navigator.clipboard.writeText(url).then(()=>alert('🔗 Link copiado! Envie pra convidar: '+url));
}
</script>
</body>
</html>
