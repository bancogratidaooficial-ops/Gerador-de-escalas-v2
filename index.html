<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Escalas 5x1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F4E79">
<style>
*{box-sizing:border-box;}
body{
  font-family:Arial, sans-serif;
  background:#f0f2f5;
  padding:8px;
  margin:0;
  padding-top: 100px; /* espaço para chave fixa */
}

/* 🔑 CHAVE FIXA — NÃO SOME AO ROLAR */
.barra-chave{
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:#1F4E79;
  color:#fff;
  padding:12px 15px;
  z-index:999;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.texto-chave{
  font-weight:bold;
  font-size:15px;
}
.botoes-topo{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.botoes-topo button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}
.btn-backup{background:#00ccff; color:#000;}
.btn-restaurar{background:#00ff88; color:#000;}
.btn-compartilhar{background:#ffcc00; color:#000;}

.box{
  background:#fff;
  border-radius:12px;
  padding:12px;
  max-width:1000px;
  margin:0 auto 10px;
}
h2{text-align:center; color:#1F4E79; margin:0 0 10px; font-size:18px;}
.msg{
  background:#e6ffea;
  color:#006622;
  padding:10px;
  border-radius:8px;
  margin:8px 0;
  display:none;
}
.card{
  background:#f9f9f9;
  border-radius:10px;
  border:2px solid #e67e22;
  padding:12px;
  margin-bottom:10px;
}
.row{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:6px;
  padding:4px 0;
  align-items:center;
}
label{font-weight:bold; color:#1F4E79; font-size:14px;}
input, select{
  width:100%;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}
button{
  padding:10px 12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin:4px 2px;
}
button.a{background:#27ae60; color:#fff;}
button.b{background:#1F4E79; color:#fff;}
button.c{background:#e67e22; color:#fff;}
button.r{background:#c0392b; color:#fff;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}
th, td{
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
}
th{
  background:#ECF0F1;
  font-weight:bold;
  background:linear-gradient(#d6eaf8, #bad9f5);
}
tr:nth-child(even){background:#f8faff;}
.areaFixa{display:none; margin-top:10px;}
.lista-item{
  background:#f8faff;
  border:1px solid #1F4E79;
  border-radius:8px;
  padding:10px;
  margin:6px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
.btn-excluir{
  background:#ff4444;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:4px 8px;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- 🔑 CHAVE FIXA — SEMPRE VISÍVEL -->
<div class="barra-chave">
  <div class="texto-chave">🔑 Chave: ESCALA-5X1-PR-2026</div>
  <div class="botoes-topo">
    <button class="btn-backup" onclick="fazerBackup()">💾 Backup</button>
    <button class="btn-restaurar" onclick="restaurarArquivo()">♻️ Restaurar</button>
    <button class="btn-compartilhar" onclick="compartilhar()">🔗 Compartilhar</button>
  </div>
</div>

<div class="box">
  <h2>📅 GERADOR DE ESCALAS 5x1 — VERSÃO FINAL</h2>
  <div id="msg" class="msg"></div>

  <div class="card">
    <label class="label">DEFINIR INÍCIO DA ESCALA 5x1 (pra não mudar)</label>
    <div class="row">
      <label>Data que começou a contar:</label>
      <input type="date" id="dataInicio" value="2026-10-01">
    </div>
    <button class="a" onclick="definirEscala()">✅ DEFINIR E TRAVAR ESCALA 5x1</button>
  </div>

  <div id="areaFixa" class="areaFixa">
    <div class="card">
      <label>1 — NOME:</label>
      <input id="nome" placeholder="Ex: José Marcos">
      <div class="row">
        <label>2 — HORÁRIO:</label>
        <input type="time" id="hinicio" value="10:00">
        <input type="time" id="hterm" value="19:00">
      </div>
      <div class="row">
        <label>3 — TIPO:</label>
        <select id="tipo">
          <option value="5x1" selected>5x1 — AUTOMÁTICO</option>
          <option value="folga">Folga fixa</option>
        </select>
      </div>
      <div class="row">
        <label>DIA FOLGA:</label>
        <select id="diaSemana">
          <option value="">Automático</option>
          <option value="Segunda">Segunda</option>
          <option value="Terça">Terça</option>
          <option value="Quarta">Quarta</option>
          <option value="Quinta">Quinta</option>
          <option value="Sexta">Sexta</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
      </div>
      <div class="row">
        <label>INÍCIO FOLGA:</label>
        <input type="text" id="inicioFolga" placeholder="Ex: 5,12,19,26">
      </div>
      <div class="row">
        <label>DIAS QUE FOLGA:</label>
        <input type="text" id="diasFolga" placeholder="Ex: 5,12,19,26">
      </div>
      <button class="a" onclick="adicionar()">➕ ADICIONAR</button>
    </div>

    <div class="card">
      <div class="row">
        <label>MÊS:</label>
        <select id="mes">
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10" selected>Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
        <label>ANO:</label>
        <input type="number" id="ano" value="2026">
      </div>
      <button class="b" onclick="gerar()">📋 GERAR ESCALA AGORA</button>
      <button class="c" onclick="salvarDefinitivo()">💾 SALVAR DEFINITIVA</button>
      <button class="a" onclick="carregarSalvo()">📂 CARREGAR SALVO</button>
    </div>

    <div id="lista" class="box" style="background:#eee; padding:8px; border-radius:8px;">
      <strong>Pessoas cadastradas:</strong> Nenhuma
    </div>

    <div class="box" style="overflow:auto;">
      <table id="tabela"></table>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;">
      <button class="b" onclick="exemplo()">📝 CARREGAR EXEMPLO COMPLETO</button>
      <button class="r" onclick="limparTudo()">🗑️ LIMPAR TUDO</button>
    </div>
  </div>
</div>

<!-- Input oculto para restaurar arquivo -->
<input type="file" id="inputRestaurar" accept=".json" style="display:none" onchange="processarRestaurar(event)">

<script>
// Registrar Service Worker → vira App!
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('✅ App registrado', reg))
      .catch(err => console.log('❌ Erro no registro', err));
  });
}

const CHAVE_DADOS = 'escala_5x1_dados';
const CHAVE_TRAVADA = 'escala_travada';
let funcs = [];
let escalaTravada = null;

window.onload = function(){
  const dadosSalvos = localStorage.getItem(CHAVE_DADOS);
  const travadaSalva = localStorage.getItem(CHAVE_TRAVADA);
  if(dadosSalvos) funcs = JSON.parse(dadosSalvos);
  if(travadaSalva){
    escalaTravada = travadaSalva;
    document.getElementById('dataInicio').value = escalaTravada;
    document.getElementById('areaFixa').style.display = 'block';
    listar();
  }
};

function definirEscala(){
  const data = document.getElementById('dataInicio').value;
  if(!data){ alert('Escolha uma data!'); return; }
  escalaTravada = data;
  localStorage.setItem(CHAVE_TRAVADA, data);
  document.getElementById('areaFixa').style.display = 'block';
  mostrarMsg('✅ Escala definida e travada em: ' + data);
}

function mostrarMsg(texto){
  const m = document.getElementById('msg');
  m.style.display = 'block';
  m.textContent = texto;
  setTimeout(()=>m.style.display='none', 4000);
}

function adicionar(){
  const nome = document.getElementById('nome').value.trim();
  if(!nome){ alert('Digite o nome!'); return; }
  const hinicio = document.getElementById('hinicio').value;
  const hterm = document.getElementById('hterm').value;
  const tipo = document.getElementById('tipo').value;
  const diaSemana = document.getElementById('diaSemana').value;
  const inicioFolga = document.getElementById('inicioFolga').value;
  const diasFolga = document.getElementById('diasFolga').value;

  funcs.push({nome, hinicio, hterm, tipo, diaSemana, inicioFolga, diasFolga});
  salvarDefinitivo();
  listar();
  
  // Limpar
  document.getElementById('nome').value = '';
  mostrarMsg('✅ ' + nome + ' adicionado!');
}

function listar(){
  const lista = document.getElementById('lista');
  if(funcs.length === 0){
    lista.innerHTML = '<strong>Pessoas cadastradas:</strong> Nenhuma';
    return;
  }
  lista.innerHTML = funcs.map((p, i) => `
    <div class="lista-item">
      <div>
        <strong>${p.nome}</strong><br>
        ${p.hinicio} às ${p.hterm} — ${p.tipo}
      </div>
      <button class="btn-excluir" onclick="remover(${i})">🗑️</button>
    </div>
  `).join('');
}

function remover(indice){
  if(confirm('Remover essa pessoa?')){
    funcs.splice(indice, 1);
    salvarDefinitivo();
    listar();
    document.getElementById('tabela').innerHTML = '';
  }
}

function salvarDefinitivo(){
  localStorage.setItem(CHAVE_DADOS, JSON.stringify(funcs));
  mostrarMsg('✅ Salvo!');
}

function carregarSalvo(){
  const dados = localStorage.getItem(CHAVE_DADOS);
  if(!dados){ alert('Nenhum dado salvo!'); return; }
  funcs = JSON.parse(dados);
  listar();
  mostrarMsg('✅ Dados carregados!');
}

function limparTudo(){
  if(!confirm('Tem certeza? Apaga tudo!')) return;
  funcs = [];
  escalaTravada = null;
  localStorage.removeItem(CHAVE_DADOS);
  localStorage.removeItem(CHAVE_TRAVADA);
  document.getElementById('areaFixa').style.display = 'none';
  document.getElementById('tabela').innerHTML = '';
  listar();
  mostrarMsg('🗑️ Tudo limpo!');
}

function exemplo(){
  funcs = [
    {nome:'Natália', hinicio:'08:00', hterm:'17:00', tipo:'5x1', diaSemana:'', inicioFolga:'', diasFolga:''},
    {nome:'Segundo', hinicio:'09:00', hterm:'18:00', tipo:'5x1', diaSemana:'', inicioFolga:'', diasFolga:''}
  ];
  salvarDefinitivo();
  listar();
  mostrarMsg('✅ Exemplo carregado!');
}

function gerar(){
  if(!escalaTravada){ alert('Defina a data de início primeiro!'); return; }
  
  const mes = parseInt(document.getElementById('mes').value);
  const ano = parseInt(document.getElementById('ano').value);
  const tabela = document.getElementById('tabela');
  
  // Dias do mês
  const diasMes = new Date(ano, mes, 0).getDate();
  const nomesDias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  
  let cabecalho = '<tr><th>Data</th><th>Dia</th>';
  funcs.forEach(p => cabecalho += `<th>${p.nome}</th>`);
  cabecalho += '</tr>';
  
  let linhas = '';
  for(let dia=1; dia<=diasMes; dia++){
    const dataAtual = new Date(ano, mes-1, dia);
    const diaSemana = nomesDias[dataAtual.getDay()];
    const dataStr = `${dia}/${mes}`;
    
    let celulas = '';
    funcs.forEach(p => {
      let texto = `${p.hinicio}–${p.hterm}`;
      let estilo = '';
      
      // Lógica 5x1: conta a partir da data inicial travada
      if(p.tipo === '5x1'){
        const dataInicioObj = new Date(escalaTravada);
        const difDias = Math.floor((dataAtual - dataInicioObj) / (1000*60*60*24));
        const ciclo = difDias % 6; // 5 trabalho + 1 folga
        if(ciclo === 5){
          texto = 'FOLGA';
          estilo = 'color:#e67e22; font-weight:bold;';
        }
      }
      
      celulas += `<td style="${estilo}">${texto}</td>`;
    });
    
    linhas += `<tr><td>${dataStr}</td><td>${diaSemana}</td>${celulas}</tr>`;
  }
  
  tabela.innerHTML = cabecalho + linhas;
  mostrarMsg('✅ Escala gerada!');
}

// 💾 BAIXAR BACKUP
function fazerBackup(){
  const dados = {
    data: new Date().toLocaleString('pt-BR'),
    versao: '2.0',
    escalaTravada,
    funcionarios: funcs
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup_escala_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarMsg('✅ Backup baixado!');
}

// ♻️ RESTAURAR
function restaurarArquivo(){
  document.getElementById('inputRestaurar').click();
}

function processarRestaurar(event){
  const arq = event.target.files[0];
  if(!arq) return;
  if(!confirm('Substitui dados atuais?')) return;
  
  const leitor = new FileReader();
  leitor.onload = (e) => {
    try{
      const d = JSON.parse(e.target.result);
      funcs = d.funcionarios || [];
      if(d.escalaTravada){
        escalaTravada = d.escalaTravada;
        localStorage.setItem(CHAVE_TRAVADA, escalaTravada);
        document.getElementById('dataInicio').value = escalaTravada;
        document.getElementById('areaFixa').style.display = 'block';
      }
      salvarDefinitivo();
      listar();
      mostrarMsg('✅ Restaurado com sucesso!');
    }catch{ alert('❌ Arquivo inválido!'); }
  };
  leitor.readAsText(arq);
  event.target.value = '';
}

// 🔗 COMPARTILHAR
function compartilhar(){
  const texto = `📅 Escala 5x1 — ${funcs.length} pessoas\nData base: ${escalaTravada || 'Não definida'}\n\n` +
    funcs.map(p => `👤 ${p.nome}: ${p.hinicio} às ${p.hterm} (${p.tipo})`).join('\n');
  
  if(navigator.share) navigator.share({title:'Escala 5x1', text:texto});
  else {navigator.clipboard.writeText(texto); alert('✅ Copiado!');}
}
</script>
</body>
</html>
